[build]
command = "npm --prefix web ci && npm --prefix web run build"
publish = "web/out"

[build.environment]
  # Match the dev machine (Node 24 / npm 11). The committed package-lock.json is
  # npm 11-shaped; Node 22 ships npm 10, which rejects it (`npm ci` EUSAGE on
  # @swc/helpers). Pinning 24 keeps dev and CI on the same npm.
  NODE_VERSION = "24"

[[redirects]]
  from = "https://www.marclaliberte.photos/*"
  to = "https://marclaliberte.photos/:splat"
  status = 301
  force = true

# Fix case-sensitive blog slug (GSC indexed wrong URL)
[[redirects]]
  from = "/blog/2025/10/29/Prohibition5/*"
  to = "/blog/2025/10/29/prohibition/"
  status = 301

[[redirects]]
  from = "/en/blog/2025/10/29/Prohibition5/*"
  to = "/en/blog/2025/10/29/prohibition/"
  status = 301

# French is the default language (no /fr/ prefix) — redirect /fr/* to root
[[redirects]]
  from = "/fr/*"
  to = "/:splat"
  status = 301

