text:
  en: "Marc's photos are incredible. The images produced by Marc clearly highlight the benefits of my massages! This is also because he listened and was faithful to my needs! I saw a clear difference thanks to these photos in terms of the arrival of new customers!"
  fr: "Les photos de Marc sont incroyables. Les images produites par Marc mettent clairement en valeur les bienfaits de mes massages! Ceci étant aussi parce qu’il a été à l’écoute et qu’il a été fidèle à mes besoins! J’ai vu une nette différence grâce à ces photos au niveau de l’arrivée de la nouvelle clientèle!"
name: "Massothérapie et Vie Active KB"
