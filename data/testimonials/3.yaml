text:
  en: "I was overwhelmed to receive this beautifully restored and colorized photo of my little brother. I didn't have any beautiful images of him at that age, before the disease took him. It's like he's here!"
  fr: "J'ai été bouleversé de recevoir la photo de mon petit frère, magnifiquement restaurée et colorisée. Je ne possédais aucune belle image de lui à cet âge, avant que la maladie ne l'emporte. On dirait qu'il est là !"
name: "Damien"
position:
  en: "Photo restoration service customer"
  fr: "Client du service de restauration photo"
