text:
  en: "I am moved... From a worn photo, damaged by time, the photographer has resurrected the faces, the settings and even the colors of yesteryear. The memory of my ancestors resurfaces, and now, will remain present for a long time."
  fr: "Je suis émue… À partir d’une photo usée, abîmée par le temps, le photographe a ressuscité les visages, les décors et même les couleurs d’antan. Le souvenir de mes aïeules ressurgit, et maintenant, demeura présent pour longtemps."
name: "Monique"
position:
  en: "Photo restoration service customer"
  fr: "Cliente du service de restauration photo"
