<figure class="enlargeable-image{{ with .Get "class" }} enlargeable-image--{{ . }}{{ end }}" itemscope itemtype="https://schema.org/ImageObject">
    {{ if .Get "title" }}
      <figcaption class="image-title" itemprop="name">{{ .Get "title" }}</figcaption>
    {{ end }}
    <img
        src="{{ .Get "src" }}"
        alt="{{ .Get "alt" }}"
        class="click-to-enlarge"
        itemprop="contentUrl"
        loading="lazy"
        data-caption="{{ if .Get "caption" }}{{ .Get "caption" }}{{ end }}"
        {{ if .Get "srcset" }}srcset="{{ .Get "srcset" }}" sizes="(max-width: 768px) 100vw, 50vw"{{ end }}
        style="cursor: zoom-in;
               {{ with .Get "width" }}width: {{ . }};{{ else }}max-width: 100%;{{ end }}
               {{ with .Get "height" }}height: {{ . }};{{ else }}height: auto;{{ end }}"
    >
    {{ if .Get "button-url" }}
    <div class="image-button-container" style="text-align: center; margin-top: 10px;">
        <a href="{{ .Get "button-url" }}" class="nav-button" target="_blank">
            {{ if .Get "button-text" }}{{ .Get "button-text" }}{{ else }}{{ i18n "moreFromShoot" }}{{ end }}
        </a>
    </div>
    {{ end }}
</figure>

{{ if not (.Page.Scratch.Get "modal_created") }}
  {{ .Page.Scratch.Set "modal_created" true }}
  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Enlarged image view">
    <button class="close" aria-label="Close image modal">&times;</button>
    <button class="modal-prev" aria-label="Previous image">&#8249;</button>
    <button class="modal-next" aria-label="Next image">&#8250;</button>
    <img class="modal-content" id="modalImage" alt="">
    <div id="modalCaption" class="modal-caption" aria-live="polite"></div>
    <div id="modalCounter" class="modal-counter" aria-live="polite"></div>
  </div>

{{ if not (.Page.Scratch.Get "jsonld_created") }}
  {{ .Page.Scratch.Set "jsonld_created" true }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "contentUrl": "{{ .Get "src" }}",
    "name": "{{ .Get "title" }}",
    "description": "{{ .Get "alt" }}",
    "caption": "{{ .Get "caption" }}",
    "associatedArticle": {
      "@type": "Article",
      "url": "{{ .Page.Permalink }}"
    }
  }
  </script>
{{ end }}

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('imageModal');
    if (!modal) return;

    var galleryImages = [];
    var currentIndex = -1;
    var isGalleryMode = false;

    function collectGalleryImages(clickedImg) {
      var gallery = clickedImg.closest('.photo-gallery');
      if (gallery) {
        isGalleryMode = true;
        galleryImages = Array.prototype.slice.call(gallery.querySelectorAll('.click-to-enlarge'));
        currentIndex = galleryImages.indexOf(clickedImg);
      } else {
        isGalleryMode = false;
        galleryImages = [];
        currentIndex = -1;
      }
      updateNavVisibility();
    }

    function updateNavVisibility() {
      var prevBtn = modal.querySelector('.modal-prev');
      var nextBtn = modal.querySelector('.modal-next');
      var counter = document.getElementById('modalCounter');
      if (isGalleryMode && galleryImages.length > 1) {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        counter.style.display = 'block';
        counter.textContent = (currentIndex + 1) + ' / ' + galleryImages.length;
      } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        counter.style.display = 'none';
      }
    }

    function showImage(img) {
      var modalImg = document.getElementById('modalImage');
      var modalCaption = document.getElementById('modalCaption');
      modalImg.src = img.src;
      modalImg.alt = img.alt;
      modalCaption.innerHTML = img.dataset.caption || '';
      modalImg.style.width = '';
      modalImg.style.height = '';
      updateNavVisibility();
    }

    function navigate(direction) {
      if (!isGalleryMode || galleryImages.length <= 1) return;
      currentIndex = (currentIndex + direction + galleryImages.length) % galleryImages.length;
      showImage(galleryImages[currentIndex]);
    }

    function openModal() {
      modal.style.display = 'flex';
      modal.offsetHeight;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.addEventListener('transitionend', function handler() {
        if (!modal.classList.contains('active')) {
          modal.style.display = 'none';
        }
        modal.removeEventListener('transitionend', handler);
      });
    }

    document.querySelectorAll('.click-to-enlarge').forEach(function(img) {
      img.onclick = function() {
        collectGalleryImages(this);
        showImage(this);
        openModal();
      };
    });

    // Prev/Next buttons
    modal.querySelector('.modal-prev').onclick = function(e) {
      e.stopPropagation();
      navigate(-1);
    };
    modal.querySelector('.modal-next').onclick = function(e) {
      e.stopPropagation();
      navigate(1);
    };

    // Close on backdrop click
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    document.getElementById('modalImage').addEventListener('click', function(e) {
      e.stopPropagation();
    });
    document.getElementById('modalCaption').addEventListener('click', function(e) {
      e.stopPropagation();
    });

    modal.querySelector('.close').onclick = function() {
      closeModal();
    };

    document.addEventListener('keydown', function(e) {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    // Touch/swipe support
    var touchStartX = 0;
    var touchEndX = 0;
    modal.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    modal.addEventListener('touchend', function(e) {
      touchEndX = e.changedTouches[0].screenX;
      var diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) navigate(1);
        else navigate(-1);
      }
    }, { passive: true });
  });
  </script>
{{ end }}
