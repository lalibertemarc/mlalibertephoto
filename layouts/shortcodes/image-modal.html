<figure class="enlargeable-image" itemscope itemtype="https://schema.org/ImageObject">
    {{ if .Get "title" }}
      <figcaption class="image-title" itemprop="name">{{ .Get "title" }}</figcaption>
    {{ end }}
    <img 
        src="{{ .Get "src" }}" 
        alt="{{ .Get "alt" }}" 
        class="click-to-enlarge" 
        itemprop="contentUrl"
        loading="lazy"
        data-caption="{{ if .Get "caption" }}{{ .Get "caption" }}{{ end }}"
        {{ if .Get "srcset" }}srcset="{{ .Get "srcset" }}" sizes="(max-width: 768px) 100vw, 50vw"{{ end }}
        style="cursor: zoom-in; 
               {{ with .Get "width" }}width: {{ . }};{{ else }}max-width: 100%;{{ end }}
               {{ with .Get "height" }}height: {{ . }};{{ else }}height: auto;{{ end }}"
    >
    {{ if .Get "button-url" }}
    <div class="image-button-container" style="text-align: center; margin-top: 10px;">
        <a href="{{ .Get "button-url" }}" class="nav-button" target="_blank">
            {{ if .Get "button-text" }}{{ .Get "button-text" }}{{ else }}{{ i18n "moreFromShoot" }}{{ end }}
        </a>
    </div>
    {{ end }}
</figure>

{{ if not (.Page.Scratch.Get "modal_created") }}
  {{ .Page.Scratch.Set "modal_created" true }}
  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-label="Enlarged image view">
    <button class="close" aria-label="Close image modal">&times;</button>
    <img class="modal-content" id="modalImage" alt="">
    <div id="modalCaption" class="modal-caption" aria-live="polite"></div>
  </div>

{{ if not (.Page.Scratch.Get "jsonld_created") }}
  {{ .Page.Scratch.Set "jsonld_created" true }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ImageObject",
    "contentUrl": "{{ .Get "src" }}",
    "name": "{{ .Get "title" }}",
    "description": "{{ .Get "alt" }}",
    "caption": "{{ .Get "caption" }}",
    "associatedArticle": {
      "@type": "Article",
      "url": "{{ .Page.Permalink }}"
    }
  }
  </script>
{{ end }}

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('imageModal');
    if (!modal) return;

    function openModal() {
      modal.style.display = 'flex';
      // Force reflow so the transition triggers
      modal.offsetHeight;
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.addEventListener('transitionend', function handler() {
        if (!modal.classList.contains('active')) {
          modal.style.display = 'none';
        }
        modal.removeEventListener('transitionend', handler);
      });
    }

    document.querySelectorAll('.click-to-enlarge').forEach(function(img) {
      img.onclick = function() {
        var modalImg = document.getElementById('modalImage');
        var modalCaption = document.getElementById('modalCaption');
        modalImg.src = this.src;
        modalImg.alt = this.alt;
        modalCaption.innerHTML = this.dataset.caption || '';

        modalImg.style.width = 'auto';
        modalImg.style.height = 'auto';

        openModal();

        if (modalImg.naturalWidth > window.innerWidth ||
            modalImg.naturalHeight > window.innerHeight) {
          var ratio = Math.min(
            window.innerWidth / modalImg.naturalWidth,
            window.innerHeight / modalImg.naturalHeight
          ) * 0.9;
          modalImg.style.width = (modalImg.naturalWidth * ratio) + 'px';
        }
      };
    });

    // Close on backdrop click (not on image/caption)
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    // Stop propagation on image and caption so clicking them doesn't close
    document.getElementById('modalImage').addEventListener('click', function(e) {
      e.stopPropagation();
    });
    document.getElementById('modalCaption').addEventListener('click', function(e) {
      e.stopPropagation();
    });

    document.querySelector('.close').onclick = function() {
      closeModal();
    };

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  });
  </script>
{{ end }}
