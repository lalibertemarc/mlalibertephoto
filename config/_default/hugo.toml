# =============================================================================
# Core Hugo Settings
# =============================================================================

baseURL = "https://marclaliberte.photos"
canonical = "https://marclaliberte.photos"
theme = "hugo-universal-theme"

enableRobotsTXT = true
disableHugoGeneratorInject = true
enableMissingTranslationPlaceholders = false

languageCode = "fr-ca"
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

summaryLength = 70
pluralizelisttitles = false

# =============================================================================
# Outputs
# =============================================================================

[outputs]
home = ["HTML", "RSS"]

# =============================================================================
# Imaging
# =============================================================================

[imaging]
quality = 85
resampleFilter = "CatmullRom"
anchor = "Center"

# =============================================================================
# Markup
# =============================================================================

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

# =============================================================================
# Services
# =============================================================================

[services]
[services.disqus]
shortname = ""
[services.googleAnalytics]
id = "G-DT1RL3KDNZ"

# =============================================================================
# Pagination
# =============================================================================

[pagination]
pagerSize = 30

# =============================================================================
# Taxonomies
# =============================================================================

[taxonomies]
category = "categories"
tag = "tags"
author = "authors"
